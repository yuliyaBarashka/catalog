<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header class="bg-dark text-white p-3">
    <div class="container">
        <h2>Контакты</h2>
    </div>
</header>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-2 bg-dark text-white min-vh-100 p-3">

            <h4>Меню</h4>

            <ul class="nav flex-column">

                <li class="nav-item">
                    <a href="/" class="nav-link text-white">
                        Главная
                    </a>
                </li>

                <li class="nav-item">
                    <a href="/catalog" class="nav-link text-white">
                        Каталог
                    </a>
                </li>

                <li class="nav-item">
                    <a href="/contacts" class="nav-link text-white">
                        Контакты
                    </a>
                </li>

            </ul>

        </div>

        <!-- Content -->
        <div class="col-10 p-5">

    <div class="row">

        <div class="col-6">

            <h2>Свяжитесь с нами</h2>

            <form method="post">

                <div class="mb-3">
                    <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Имя"
                    >
                </div>

                <div class="mb-3">
                    <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Почта"
                    >
                </div>

                <div class="mb-3">
                    <textarea
                            name="message"
                            class="form-control"
                            rows="5"
                            placeholder="Сообщение"
                    ></textarea>
                </div>

                <button class="btn btn-primary" type="submit">
                    Отправить
                </button>

            </form>

        </div>

        <div class="col-6">

            <h2>Наши контакты</h2>

            <p>
                Телефон: +7 999 999 99 99
            </p>

            <p>
                Email: info@mail.ru
            </p>

            <p>
                Адрес: Москва
            </p>

        </div>

    </div>

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 Интернет-магазин
    ИНН: 555512345
    КПП: 555501001
    Адрес: г.Москва, ул Такаято
</footer>

</body>
</html>
